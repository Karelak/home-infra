services:
  kaarel:
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "pgrep -f 'python run.py' || exit 1"
      timeout: "30s"
    image: "rdavidoff/twitch-channel-points-miner-v2:latest"
    restart: "unless-stopped"
    volumes:
      - "twitch-miner:/usr/src/app"
      - "/home/kaarel/twitch-miner/kaarel.py:/usr/src/app/run.py"
volumes:
  twitch-miner: null
