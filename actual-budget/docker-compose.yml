volumes:
  actual-budget:
services:
  server:
    image: actualbudget/actual-server:latest
    labels:
      docker-volume-backup.stop-during-backup: actual-budget
    ports:
      - 5006:5006
    volumes:
      - actual-budget:/data
    healthcheck:
      test: ["CMD-SHELL", "node scripts/health-check.js"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
