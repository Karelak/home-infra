networks:
  actual-budget:
volumes:
  actual-budget:
services:
  server:
    image: docker.io/actualbudget/actual-server:latest
    hostname: actual-budget
    labels:
      - docker-volume-backup.stop-during-backup=actual-budget
    ports:
      - 5006:5006
    volumes:
      - actual-budget:/data
    healthcheck:
      test: ["CMD-SHELL", "node scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - actual-budget
    restart: unless-stopped
