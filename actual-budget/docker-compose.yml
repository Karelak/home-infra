services:
  backup:
    environment:
      AGE_PUBLIC_KEYS: "${AGE_PUBLIC_KEYS}"
      BACKUP_JITTER: "1h"
      BACKUP_RETENTION_DAYS: 5
      BACKUP_STOP_DURING_BACKUP_LABEL: "actual-budget"
      DROPBOX_APP_KEY: "${DROPBOX_APP_KEY}"
      DROPBOX_APP_SECRET: "${DROPBOX_APP_SECRET}"
      DROPBOX_REFRESH_TOKEN: "${DROPBOX_REFRESH_TOKEN}"
      DROPBOX_REMOTE_PATH: "/backups/actual-budget"
    image: "offen/docker-volume-backup:latest"
    restart: "always"
    volumes:
      - "actual-budget:/backup/actual-budget:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
  server:
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "node scripts/health-check.js"
      timeout: "30s"
    image: "actualbudget/actual-server:latest"
    labels:
      docker-volume-backup.stop-during-backup: "actual-budget"
    ports:
      - "5006:5006"
    restart: "unless-stopped"
    volumes:
      - "actual-budget:/data"
volumes:
  actual-budget: null
