services:
  factorio:
    restart: unless-stopped
    image: factoriotools/factorio:2.0.77 #specific version due to pirated gog copy
    ports:
      - "34197:34197/udp"
    volumes:
      - factorio:/factorio
    healthcheck:
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    environment:
      DLC_SPACE_AGE: true
      UPDATE_MODS_ON_START: true
      USERNAME: ${USERNAME}
      TOKEN: ${TOKEN}

volumes:
  factorio:
