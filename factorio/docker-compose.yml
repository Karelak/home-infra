services:
  factorio:
    restart: unless-stopped
    image: factoriotools/factorio:2.0.77
    ports:
      - "34197:34197/udp"

    volumes:
      - factorio:/factorio
    environment:
      - DLC_SPACE_AGE=true
      - UPDATE_MODS_ON_START=true
      - USERNAME=${USERNAME}
      - TOKEN=${TOKEN}

volumes:
  factorio:
