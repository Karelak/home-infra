services:
  flaresolverr:
    image: "ghcr.io/thephaseless/byparr:latest"
    hostname: flaresolverr
    restart: unless-stopped
    volumes:
      - flaresolverr:/config
    expose:
      - 8191
    networks:
      - jackett
    healthcheck:
      # healtcheck is built into image so no need to set it up here as a command
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  jackett:
    image: "lscr.io/linuxserver/jackett:latest"
    hostname: jackett
    restart: unless-stopped
    depends_on:
      flaresolverr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9117"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - jackett:/config
    ports:
      - 9117:9117
    networks:
      - jackett
networks:
  jackett:
volumes:
  jackett:
  flaresolverr:
