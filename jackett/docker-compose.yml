services:
  flaresolverr:
    image: "ghcr.io/thephaseless/byparr:latest"
    hostname: flaresolverr
    restart: unless-stopped
    volumes:
      - "flaresolverr:/config"
    expose:
      - 8191
    networks:
      - jackett
  jackett:
    image: "lscr.io/linuxserver/jackett:latest"
    hostname: jackett
    restart: unless-stopped
    depends_on:
      - flaresolverr

    volumes:
      - "jackett:/config"
    ports:
      - 9117:9117
    networks:
      - jackett
networks:
  jackett:
volumes:
  jackett:
  flaresolverr:
