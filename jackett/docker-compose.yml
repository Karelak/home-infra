networks:
  jackett:
services:
  flaresolverr:
    expose:
      - 8191
    healthcheck:
      interval: 1m30s
      retries: 5
      start_period: 30s
      timeout: 30s
    hostname: flaresolverr
    image: ghcr.io/thephaseless/byparr:latest
    networks:
      - jackett
    restart: unless-stopped
    volumes:
      - flaresolverr:/config
  jackett:
    depends_on:
      flaresolverr:
        condition: service_healthy
    healthcheck:
      interval: 1m30s
      retries: 5
      start_period: 30s
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9117
      timeout: 30s
    hostname: jackett
    image: lscr.io/linuxserver/jackett:latest
    networks:
      - jackett
    ports:
      - 9117:9117
    restart: unless-stopped
    volumes:
      - jackett:/config
volumes:
  flaresolverr: null
  jackett: null
