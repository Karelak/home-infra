name: tofu

on:
  push:
    paths:
      - "terraform/**"
      - ".github/workflows/tofu.yml"

concurrency:
  group: tofu
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "~1.10"
      - name: Write OCI key
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > "$RUNNER_TEMP/oci.pem"
          chmod 600 "$RUNNER_TEMP/oci.pem"
          echo "TF_VAR_private_key_path=$RUNNER_TEMP/oci.pem" >> "$GITHUB_ENV"
      - run: tofu init -input=false
      - run: tofu validate
      - run: tofu plan -input=false -lock-timeout=5m

  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "~1.10"
      - name: Write OCI key
        run: |
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > "$RUNNER_TEMP/oci.pem"
          chmod 600 "$RUNNER_TEMP/oci.pem"
          echo "TF_VAR_private_key_path=$RUNNER_TEMP/oci.pem" >> "$GITHUB_ENV"
      - run: tofu init -input=false
      - run: tofu plan -input=false -lock-timeout=5m -out=tfplan
      - run: tofu apply -input=false -lock-timeout=5m tfplan
