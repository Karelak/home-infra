networks:
  nginx: null
services:
  backup:
    environment:
      AGE_PUBLIC_KEYS: "${AGE_PUBLIC_KEYS}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_ENDPOINT: "${AWS_ENDPOINT}"
      AWS_S3_BUCKET_NAME: "${AWS_S3_BUCKET_NAME}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      BACKUP_JITTER: "1h"
      BACKUP_RETENTION_DAYS: 5
      BACKUP_STOP_DURING_BACKUP_LABEL: "nginx"
      EXEC_LABEL: "nginx"
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "test -f /tmp/last_success && test $$(( $$(date +%s) - $$(cat /tmp/last_success) )) -lt 90000"
      timeout: "30s"
    image: "offen/docker-volume-backup:latest"
    labels:
      docker-volume-backup.prune-post: "/bin/sh -c 'date +%s > /tmp/last_success'"
    restart: "always"
    volumes:
      - "pgdump:/backup/pgdump:ro"
      - "nginx:/backup/nginx:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
  nginx:
    depends_on:
      postgres:
        condition: "service_healthy"
    environment:
      DB_POSTGRES_HOST: "postgres"
      DB_POSTGRES_NAME: "${POSTGRES_DB}"
      DB_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_POSTGRES_PORT: 5432
      DB_POSTGRES_USER: "${POSTGRES_USER}"
      DISABLE_IPV6: true
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD"
        - "/usr/bin/check-health"
      timeout: "30s"
    hostname: "nginx"
    image: "jc21/nginx-proxy-manager:latest"
    labels:
      docker-volume-backup.stop-during-backup: "nginx"
    networks:
      - "nginx"
    ports:
      - "443:443"
      - "80:80"
      - "81:81"
    restart: "unless-stopped"
    volumes:
      - "nginx:/data"
      - "letsencrypt:/etc/letsencrypt"
  postgres:
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    expose:
      - 5432
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "pg_isready"
      timeout: "30s"
    hostname: "postgres"
    image: "postgres:15-alpine"
    labels:
      docker-volume-backup.archive-pre: "/bin/sh -c 'pg_dump -Fc -U $$POSTGRES_USER -d $$POSTGRES_DB -f /tmp/nginx.dump'"
      docker-volume-backup.exec-label: "nginx"
    networks:
      - "nginx"
    restart: "unless-stopped"
    volumes:
      - "postgres:/var/lib/postgresql/data"
      - "pgdump:/tmp"
volumes:
  letsencrypt: null
  nginx: null
  pgdump: null
  postgres: null
