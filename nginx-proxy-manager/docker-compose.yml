networks:
  nginx:
volumes:
  nginx:
  letsencrypt:
  postgres:
services:
  nginx:
    hostname: nginx-proxy-manager
    image: "jc21/nginx-proxy-manager:latest"

    environment:
      DISABLE_IPV6: "true"
    networks:
      - nginx
    ports:
      - "443:443"
      - "80:80"
      - "81:81"
    labels:
      - docker-volume-backup.stop-during-backup=nginx-proxy-manager
    restart: unless-stopped
    volumes:
      - "nginx:/data"
      - "letsencrypt:/etc/letsencrypt"
  postgres:
    image: "postgres:15-alpine"
    hostname: postgres
    restart: unless-stopped
    volumes:
      - "postgres:/var/lib/postgresql/data"

    expose:
      - 5432
    networks:
      - nginx
  backup:
    image: "offen/docker-volume-backup:latest"

    volumes:
      - "nginx:/backup/nginx:ro"
      - "letsencrypt:/backup/letsencrypt:ro"
      - "postgres:/backup/postgres:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: always
