networks:
  nginx: null
services:
  nginx:
    depends_on:
      postgres:
        condition: "service_healthy"
    environment:
      DB_POSTGRES_HOST: "postgres"
      DB_POSTGRES_NAME: "${POSTGRES_DB}"
      DB_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_POSTGRES_PORT: 5432
      DB_POSTGRES_USER: "${POSTGRES_USER}"
      DISABLE_IPV6: true
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD"
        - "/usr/bin/check-health"
      timeout: "30s"
    hostname: "nginx-proxy-manager"
    image: "jc21/nginx-proxy-manager:latest"
    labels:
      docker-volume-backup.stop-during-backup: "nginx-proxy-manager"
    networks:
      - "nginx"
    ports:
      - "443:443"
      - "80:80"
      - "81:81"
    restart: "unless-stopped"
    volumes:
      - "nginx:/data"
      - "letsencrypt:/etc/letsencrypt"
  postgres:
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    expose:
      - 5432
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "pg_isready"
      timeout: "30s"
    hostname: "postgres"
    image: "postgres:15-alpine"
    labels:
      docker-volume-backup.stop-during-backup: "nginx-proxy-manager"
    networks:
      - "nginx"
    restart: "unless-stopped"
    volumes:
      - "postgres:/var/lib/postgresql/data"
volumes:
  letsencrypt: null
  nginx: null
  postgres: null
