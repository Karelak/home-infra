networks:
  nginx: null
services:
  backup:
    environment:
      AGE_PUBLIC_KEYS: ${AGE_PUBLIC_KEYS}
      BACKUP_JITTER: 1h
      BACKUP_RETENTION_DAYS: 5
      BACKUP_STOP_DURING_BACKUP_LABEL: nginx-proxy-manager
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET}
      DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN}
      DROPBOX_REMOTE_PATH: /backups/nginx
    image: offen/docker-volume-backup:latest
    restart: always
    volumes:
      - nginx:/backup/nginx:ro
      - letsencrypt:/backup/letsencrypt:ro
      - postgres:/backup/postgres:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
  nginx:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_POSTGRES_HOST: postgres
      DB_POSTGRES_NAME: ${POSTGRES_DB}
      DB_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRES_PORT: 5432
      DB_POSTGRES_USER: ${POSTGRES_USER}
      DISABLE_IPV6: true
    hostname: nginx-proxy-manager
    image: jc21/nginx-proxy-manager:latest
    labels:
      docker-volume-backup.stop-during-backup: nginx-proxy-manager
    networks:
      - nginx
    ports:
      - 443:443
      - 80:80
      - 81:81
    restart: unless-stopped
    volumes:
      - nginx:/data
      - letsencrypt:/etc/letsencrypt
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    expose:
      - 5432
    healthcheck:
      interval: 1m30s
      retries: 5
      start_period: 30s
      test:
        - CMD-SHELL
        - pg_isready
      timeout: 30s
    hostname: postgres
    image: postgres:15-alpine
    labels:
      docker-volume-backup.stop-during-backup: nginx-proxy-manager
    networks:
      - nginx
    restart: unless-stopped
    volumes:
      - postgres:/var/lib/postgresql/data
volumes:
  letsencrypt: null
  nginx: null
  postgres: null
