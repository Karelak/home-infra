networks:
  vaultwarden: null
services:
  backup:
    environment:
      AGE_PUBLIC_KEYS: "${AGE_PUBLIC_KEYS}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_ENDPOINT: "${AWS_ENDPOINT}"
      AWS_S3_BUCKET_NAME: "${AWS_S3_BUCKET_NAME}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      BACKUP_JITTER: "1h"
      BACKUP_RETENTION_DAYS: 5
      BACKUP_STOP_DURING_BACKUP_LABEL: "vaultwarden"
      EXEC_LABEL: "vaultwarden"
    image: "offen/docker-volume-backup:latest"
    restart: "always"
    volumes:
      - "pgdump:/backup/pgdump:ro"
      - "vaultwarden:/backup/vaultwarden:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
  postgres:
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    expose:
      - 5432
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      timeout: "30s"
    hostname: "postgres"
    image: "postgres:15-alpine"
    labels:
      docker-volume-backup.archive-pre: "/bin/sh -c 'pg_dump -Fc -U $$POSTGRES_USER -d $$POSTGRES_DB -f /tmp/vaultwarden.dump'"
      docker-volume-backup.exec-label: "vaultwarden"
    networks:
      - "vaultwarden"
    restart: "unless-stopped"
    volumes:
      - "postgres:/var/lib/postgresql/data"
      - "pgdump:/tmp"
  vaultwarden:
    depends_on:
      postgres:
        condition: "service_healthy"
    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      DOMAIN: "${DOMAIN}"
      LOG_FILE: "/data/vaultwarden.log"
      PUSH_ENABLED: true
      PUSH_IDENTITY_URI: "https://identity.bitwarden.eu"
      PUSH_INSTALLATION_ID: "${PUSH_INSTALLATION_ID}"
      PUSH_INSTALLATION_KEY: "${PUSH_INSTALLATION_KEY}"
      PUSH_RELAY_URI: "https://api.bitwarden.eu"
      SHOW_PASSWORD_HINT: true
      SIGNUPS_ALLOWED: true
      SMTP_FROM: "${SMTP_FROM}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_PORT: 587
      SMTP_SECURITY: "starttls"
      SMTP_USERNAME: "${SMTP_USERNAME}"
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      timeout: "30s"
    hostname: "vaultwarden"
    image: "vaultwarden/server:latest"
    labels:
      docker-volume-backup.stop-during-label: "vaultwarden"
    networks:
      - "vaultwarden"
    ports:
      - "83:80"
      - "587:587"
    restart: "unless-stopped"
    volumes:
      - "vaultwarden:/data"
volumes:
  pgdump: null
  postgres: null
  vaultwarden: null
