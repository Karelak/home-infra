networks:
  n8n: null
services:
  backup:
    environment:
      AGE_PUBLIC_KEYS: "${AGE_PUBLIC_KEYS}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_ENDPOINT: "${AWS_ENDPOINT}"
      AWS_S3_BUCKET_NAME: "${AWS_S3_BUCKET_NAME}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      BACKUP_JITTER: "1h"
      BACKUP_RETENTION_DAYS: 5
      BACKUP_STOP_DURING_BACKUP_LABEL: "actual-budget"
    image: "offen/docker-volume-backup:latest"
    restart: "always"
    volumes:
      - "actual-budget:/backup/actual-budget:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
  n8n:
    depends_on:
      postgres:
        condition: "service_healthy"
    environment:
      DB_POSTGRESDB_DATABASE: "${POSTGRES_DB}"
      DB_POSTGRESDB_HOST: "postgres"
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: "${POSTGRES_USER}"
      DB_TYPE: "postgresdb"
      GENERIC_TIMEZONE: "Europe/London"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: true
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
      N8N_GIT_NODE_DISABLE_BARE_REPOS: true
      N8N_MIGRATE_FS_STORAGE_PATH: true
      N8N_NATIVE_PYTHON_RUNNER: true
      N8N_PROTOCOL: "https"
      N8N_PROXY_HOPS: 1
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      N8N_RUNNERS_MODE: "external"
      N8N_SKIP_AUTH_ON_OAUTH_CALLBACK: false
      NODE_ENV: "production"
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "wget --spider -q http://localhost:5678/healthz/readiness || exit 1"
      timeout: "30s"
    hostname: "n8n"
    image: "n8nio/n8n:latest"
    networks:
      - "n8n"
    ports:
      - "5678:5678"
    restart: "unless-stopped"
    volumes:
      - "n8n:/home/node/.n8n"
  postgres:
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    expose:
      - 5432
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      timeout: "30s"
    hostname: "postgres"
    image: "postgres:17-alpine"
    networks:
      - "n8n"
    restart: "unless-stopped"
    volumes:
      - "postgres:/var/lib/postgresql/data"
  runners:
    depends_on:
      n8n:
        condition: "service_healthy"
    environment:
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"
      N8N_RUNNERS_TASK_BROKER_URI: "http://n8n:5679"
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "wget --spider -q http://localhost:5680/healthz || exit 1"
      timeout: "30s"
    image: "n8nio/runners:latest"
    networks:
      - "n8n"
    restart: "unless-stopped"
volumes:
  n8n: null
  postgres: null
