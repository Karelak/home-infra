networks:
  n8n: null
services:
  n8n:
    depends_on:
      postgres:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
    environment:
      DB_POSTGRESDB_DATABASE: "${POSTGRES_DB}"
      DB_POSTGRESDB_HOST: "postgres"
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: "${POSTGRES_USER}"
      DB_TYPE: "postgresdb"
      EXECUTIONS_MODE: "queue"
      GENERIC_TIMEZONE: "Europe/London"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: true
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
      N8N_GIT_NODE_DISABLE_BARE_REPOS: true
      N8N_MIGRATE_FS_STORAGE_PATH: true
      N8N_NATIVE_PYTHON_RUNNER: true
      N8N_PROTOCOL: "https"
      N8N_PROXY_HOPS: 1
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      N8N_RUNNERS_MODE: "external"
      N8N_SKIP_AUTH_ON_OAUTH_CALLBACK: false
      NODE_ENV: "production"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: true
      QUEUE_BULL_REDIS_HOST: "redis"
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "wget --spider -q http://localhost:5678/healthz/readiness || exit 1"
      timeout: "30s"
    hostname: "n8n"
    image: "n8nio/n8n:latest"
    networks:
      - "n8n"
    ports:
      - "5678:5678"
    restart: "unless-stopped"
    volumes:
      - "n8n:/home/node/.n8n"
  postgres:
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    expose:
      - 5432
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "pg_isready"
      timeout: "30s"
    hostname: "postgres"
    image: "postgres:15-alpine"
    networks:
      - "n8n"
    restart: "unless-stopped"
    volumes:
      - "postgres:/var/lib/postgresql/data"
  redis:
    expose:
      - 6379
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD"
        - "redis-cli"
        - "ping"
      timeout: "30s"
    hostname: "redis"
    image: "redis:latest"
    networks:
      - "n8n"
    restart: "unless-stopped"
  task-runners:
    depends_on:
      worker:
        condition: "service_healthy"
    environment:
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"
      N8N_RUNNERS_TASK_BROKER_URI: "http://worker:5679"
    expose:
      - 5681
      - 5682
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "wget -q --spider http://localhost:5681/healthz && wget -q --spider http://localhost:5682/healthz"
      timeout: "30s"
    image: "n8nio/runners:latest"
    networks:
      - "n8n"
    restart: "unless-stopped"
  worker:
    command: "worker"
    depends_on:
      n8n:
        condition: "service_healthy"
      postgres:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
    environment:
      DB_POSTGRESDB_DATABASE: "${POSTGRES_DB}"
      DB_POSTGRESDB_HOST: "postgres"
      DB_POSTGRESDB_PASSWORD: "${POSTGRES_PASSWORD}"
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: "${POSTGRES_USER}"
      DB_TYPE: "postgresdb"
      EXECUTIONS_MODE: "queue"
      GENERIC_TIMEZONE: "Europe/London"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: true
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 10
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: true
      N8N_NATIVE_PYTHON_RUNNER: true
      N8N_RUNNERS_AUTH_TOKEN: "${N8N_RUNNERS_AUTH_TOKEN}"
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      N8N_RUNNERS_MODE: "external"
      NODE_ENV: "production"
      QUEUE_BULL_REDIS_HOST: "redis"
      QUEUE_HEALTH_CHECK_ACTIVE: true
    healthcheck:
      interval: "1m30s"
      retries: 5
      start_period: "30s"
      test:
        - "CMD-SHELL"
        - "wget --spider -q http://localhost:5678/healthz/readiness || exit 1"
      timeout: "30s"
    image: "n8nio/n8n:latest"
    networks:
      - "n8n"
    restart: "unless-stopped"
    volumes:
      - "n8n:/home/node/.n8n"
volumes:
  n8n: null
  postgres: null
