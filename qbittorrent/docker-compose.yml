volumes:
  qbittorrent:
  downloads:
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    hostname: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - qbittorrent:/config
      - downloads:/downloads
    ports:
      - 8080:8080 # webui
      - 6881:6881 # torrenting
      - 6881:6881/udp # torrenting
    restart: unless-stopped
