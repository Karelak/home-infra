services:
  qbittorrent:
    environment:
      PGID: 1000
      PUID: 1000
      TORRENTING_PORT: 6881
      TZ: Europe/London
      WEBUI_PORT: 8080
    hostname: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
    volumes:
      - qbittorrent:/config
      - downloads:/downloads
volumes:
  downloads: null
  qbittorrent: null
